const TINTS = [
  { id: "ice", label: "Ice", bg: "#EAF5F8", dot: "#3691CD" },
  { id: "mint", label: "Mint", bg: "#E7F4ED", dot: "#A9D5BE" },

];
const tintOf = (id?: string) => TINTS.find(t => t.id === id) || TINTS[0];
const clamp = (v: number, lo: number, hi: number) => Math.max(lo, Math.min(hi, v));
// Mix a hex colour toward white (amt > 0) or black (amt < 0); used for the robots' shading.
const tone = (hex: string, amt: number) => {
  const n = parseInt(hex.slice(1), 16), t = amt < 0 ? 0 : 255, k = Math.abs(amt);
  const ch = (sh: number) => Math.round(((n >> sh) & 255) + (t - ((n >> sh) & 255)) * k).toString(16).padStart(2, "0");
  return "#" + ch(16) + ch(8) + ch(0);
};

/* ---------------------------------------------------------------- new agent */

function Robot({ look, size = 64 }: { look: number; size?: number }) {
  const L = LOOKS[look] || LOOKS[0];
  // Gradient/filter ids must be unique per instance; useId output has colons, which url(#…) dislikes.
  const id = "rb" + React.useId().replace(/[^a-zA-Z0-9]/g, "");
  const u = (n: string) => `url(#${id}-${n})`;
  const edge = tone(L.body, -.45);
  const acc = L.accColor || L.body;
  const accEdge = tone(acc, -.4);
  const limb = { fill: u("limb"), stroke: edge, strokeWidth: 1.5 };
  const accLine = { fill: u("acc"), stroke: accEdge, strokeWidth: 1.4, strokeLinejoin: "round" as const };
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" aria-hidden="true" shapeRendering="geometricPrecision">
      <defs>
        <linearGradient id={`${id}-body`} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor={tone(L.body, .38)} />
          <stop offset=".55" stopColor={L.body} />
          <stop offset="1" stopColor={tone(L.body, -.3)} />
        </linearGradient>
        <linearGradient id={`${id}-limb`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={tone(L.body, -.06)} />
          <stop offset="1" stopColor={tone(L.body, -.34)} />
        </linearGradient>
        <radialGradient id={`${id}-sheen`} cx=".3" cy=".2" r=".6">
          <stop offset="0" stopColor="#fff" stopOpacity=".6" />
          <stop offset="1" stopColor="#fff" stopOpacity="0" />
        </radialGradient>
        <linearGradient id={`${id}-visor`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={tone(L.visor, .24)} />
          <stop offset="1" stopColor={tone(L.visor, -.38)} />
        </linearGradient>
        <radialGradient id={`${id}-screen`} cx=".5" cy=".55" r=".6">
          <stop offset="0" stopColor={L.glow} stopOpacity=".3" />
          <stop offset="1" stopColor={L.glow} stopOpacity="0" />
        </radialGradient>
        <linearGradient id={`${id}-acc`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={tone(acc, .32)} />
          <stop offset="1" stopColor={tone(acc, -.22)} />
        </linearGradient>
        <linearGradient id={`${id}-chef`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#FFFFFF" />
          <stop offset="1" stopColor="#D6DEE2" />
        </linearGradient>
        <radialGradient id={`${id}-shadow`}>
          <stop offset="0" stopColor="#101820" stopOpacity=".3" />
          <stop offset="1" stopColor="#101820" stopOpacity="0" />
        </radialGradient>
        <filter id={`${id}-glow`} x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.8" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>

      <ellipse cx="60" cy="109" rx="36" ry="6.5" fill={u("shadow")} />
      {/* pack and legs sit behind the shell */}
      <rect x="13" y="50" width="20" height="38" rx="9" {...limb} />
      <rect x="37" y="82" width="19" height="25" rx="8.5" {...limb} />
      <rect x="64" y="82" width="19" height="25" rx="8.5" {...limb} />
      <path d="M41 101.5h11M68 101.5h11" stroke="#fff" strokeOpacity=".18" strokeWidth="2" strokeLinecap="round" />

      {/* shell: base gradient, soft top-left sheen, right rim light */}
      <rect x="24" y="22" width="72" height="72" rx="31" fill={u("body")} stroke={edge} strokeWidth="1.5" />
      <rect x="24" y="22" width="72" height="72" rx="31" fill={u("sheen")} />
      <path d="M90 46c3.6 10 3.4 24-2 34" fill="none" stroke="#fff" strokeOpacity=".24" strokeWidth="3" strokeLinecap="round" />
      {L.acc !== "scarf" && <circle cx="73" cy="81" r="2.2" fill={L.glow} filter={u("glow")} />}

      {L.acc === "scarf" && (
        <g>
          <path d="M72 79l3.5 21c.4 2.2 3.2 2.8 4.6 1.1L87 93l-5.5-15z" {...accLine} />

      <path d="M43.5 45c3-2.8 8-3.8 13-3.6" fill="none" stroke="#fff" strokeOpacity=".6" strokeWidth="2.6" strokeLinecap="round" />
      <circle cx="80.5" cy="61" r="1.5" fill="#fff" fillOpacity=".35" />

      {L.acc === "antenna" && (
        <g>
          <path d="M60 23V10" stroke={edge} strokeWidth="3" strokeLinecap="round" />

          <circle cx="60" cy="8.5" r="9" fill={L.glow} opacity=".28" />

          <circle cx="58.3" cy="6.8" r="1.6" fill="#fff" opacity=".85" />

      )}
      {L.acc === "cap" && (
        <g>
          <path d="M80 33.5c10-1 21 0 27 3 2 1.2 1 4-1.5 4-8 0-17-1-26-2.5z" {...accLine} fill={tone(acc, -.1)} />

          <path d="M26 33C26 4 94 4 94 33z" {...accLine} />
          <rect x="55" y="7.5" width="10" height="25" rx="4" fill={tone(acc, .3)} stroke={accEdge} strokeWidth="1.2" />

          <path d="M34 24c3-7 9-11 16-13" fill="none" stroke="#fff" strokeOpacity=".45" strokeWidth="2.2" strokeLinecap="round" />
        </g>
      )}
      {L.acc === "chef" && (
        <g>
          <g fill={u("chef")}>
            <circle cx="44" cy="18" r="10.5" /><circle cx="76" cy="18" r="10.5" /><circle cx="60" cy="13" r="12.5" />
          </g>
          <path d="M41 11c2-2 5-3 8-3M56 5c2-1 5-1.4 7-1" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" />
          <rect x="36" y="18" width="48" height="15" rx="5" fill={u("chef")} stroke="#B9C4CA" strokeWidth="1.2" />
          <path d="M48 21v9M60 21v9M72 21v9" stroke="#B9C4CA" strokeOpacity=".7" strokeWidth="1" strokeLinecap="round" />
        </g>
      )}
      {L.acc === "headphones" && (
        <g>
          <path d="M22 54C22 10 98 10 98 54" fill="none" stroke={tone(acc, -.4)} strokeWidth="7" strokeLinecap="round" />
          <path d="M22 54C22 10 98 10 98 54" fill="none" stroke={tone(acc, .25)} strokeOpacity=".6" strokeWidth="2" strokeLinecap="round" />
          <rect x="13" y="43" width="17" height="27" rx="7.5" {...accLine} />

// Lanyard hardware: crimp end for the ribbon, swivel, split ring and a clear tab that feeds into the badge slot.
function Clip() {
  const id = "cl" + React.useId().replace(/[^a-zA-Z0-9]/g, "");
  const metal = `url(#${id}-m)`;
  return (
    <svg className="clip" width="56" height="70" viewBox="0 0 56 70" aria-hidden="true" shapeRendering="geometricPrecision">

function Logo({ id, size = 16 }: { id: string; size?: number }) {
  const L = (LOGOS as any)[id];
  if (!L) return null;
  const [vx, vy, vw, vh] = L.vb.split(" ").map(Number);
  return (
    <svg width={size} height={size} viewBox={L.vb} aria-hidden="true" overflow="visible">
      {L.bg && <rect x={vx} y={vy} width={vw} height={vh} rx={vw * .24} fill={L.bg} />}
      {L.parts.map(([fill, d, tf]: [string | null, string, string?], i: number) => <path key={i} d={d} fill={fill || "currentColor"} transform={tf} />)}
    </svg>
  );
}

// A server's logo, or its initials when there is no drawn mark.
function ServerMark({ s, size }: { s: Server; size: number }) {
  if ((LOGOS as any)[s.logo]) return <Logo id={s.logo} size={size} />;
  const initials = s.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return <span className="mono" style={{ fontSize: Math.round(size * .6) }} aria-hidden="true">{initials}</span>;
}

/* ============================================================ the agent ID card */

// Whoever is creating the agent signs the card. Sample value for this page.
const ISSUER = "Ashok";
// The card is a printed object: every agent gets the same pearl finish and silver chip, in both themes,
// whatever model it runs on. The model is a setting, not a material.
const METALS: Record<string, [string, string, string, string]> = {
  gold: ["#F6DE96", "#D9AE4B", "#B88A2E", "#8C6519"],
  silver: ["#F4F7F8", "#C9D1D6", "#97A3AA", "#6B777E"],
  copper: ["#F6CDB3", "#DB9A76", "#B06A48", "#80462B"],
};
const CARD_FINISH = "pearl", CARD_METAL = "silver";
const metalVars = (metal: string) => Object.fromEntries((METALS[metal] || METALS.silver).map((c, i) => ["--m" + i, c]));
const MAX_SERVERS = 10, MAX_SKILLS = 6; // two rows of tiles, three rows of tags; past that it says "+N more"

const hash = (s: string) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const idNoOf = (d: Draft) => "AG-" + (hash(handleOf(d.name) || "draft") % 9000 + 1000);
// A pre-drawn squiggle for "Sign for me" (and keyboard users): same 240x60 box as the pad.
const AUTO_SIG = "M10 42c6-20 14-30 16-22s-6 24-2 24 10-26 16-24-4 20 2 20 8-14 12-14 2 12 6 12 6-16 12-16 0 14 6 14 10-8 14-12M86 30c6-8 10-10 10-4s-4 14 2 12 8-14 14-12 2 10 8 8 14-12 22-12M20 50c40-4 100-8 170-12";
// Machine-readable zone: three 30-character lines, like the bottom of a passport or ID card.
const mrzPad = (s: string) => (s.toUpperCase().replace(/[^A-Z0-9<]/g, "<") + "<".repeat(30)).slice(0, 30);
const mrzOf = (d: Draft) => {
  const no = idNoOf(d).replace("-", ""), now = new Date();
  const ymd = String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0");
  const words = (d.name.trim() || "unnamed").split(/\s+/);
  return [
    mrzPad("AGTRX" + no + (hash(no) % 10) + "<<" + (d.scope === "tenant" ? "W" : "P")),
    mrzPad(ymd + (hash(ymd + no) % 10) + "<" + modelOf(d.model).shortLabel.replace(/[ .]/g, "") + "<" + Object.keys(d.servers).length + "S" + d.skills.length + "K"),
    mrzPad(words[0] + "<<" + words.slice(1).join("<")),
  ];
};
const restrictionsOf = (d: Draft) => {
  const s = attachedOf(d), w = s.filter(x => d.servers[x.id] === "write").map(x => x.name);
  if (!s.length) return "no access granted yet";
  const rule = !w.length ? "read only, everywhere" : w.length === s.length ? "may write wherever it can open" : `read only, except ${shortList(w)}`;
  return rule;
};
const listOf = (a: string[]) => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const shortList = (a: string[], max = 3) => a.length > max ? `${a.slice(0, max - 1).join(", ")} and ${a.length - max + 1} more` : listOf(a);
const nGuideOf = (d: Draft) => [d.topics === "open" ? "any topic" : "on-purpose only", guideCount(d.rules, d.rulesAs, "rule"), guideCount(d.behaviour, d.behaviourAs, "behaviour")]
  .map((t, i) => t && (t === "written" ? (i === 2 ? "behaviour written" : "rules written") : t)).filter(Boolean).join(" · ");
const TODAY = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();

// Security engraving for the front: a band of crossing sine lines across the body of the card. Computed once.
const GUILLOCHE = (() => {
  const waves: string[] = [];
  for (let i = 0; i < 22; i++) {
    let p = "";
    for (let x = -10; x <= 310; x += 5) {
      const y = 206 + i * 9 + 14 * Math.sin(x / 34 + i * .45) + 6 * Math.sin(x / 13 - i * .3);
      p += (x === -10 ? "M" : "L") + x + " " + y.toFixed(1);
    }
    waves.push(p);
  }
  return waves;
})();

function Guilloche() {
  return (
    <svg className="guil" viewBox="0 0 300 476" preserveAspectRatio="none" fill="none" stroke="currentColor" aria-hidden="true">
      {GUILLOCHE.map((p, i) => <path key={i} d={p} strokeWidth=".5" />)}
    </svg>
  );
}

// Decorative bars from the ID number, like a printed badge. Not scannable.
function Barcode({ seed, w = 78, h = 22 }: { seed: string; w?: number; h?: number }) {
  const bars: [number, number][] = [];
  for (let x = 0, i = 0; x < w; i++) {
    const n = hash(seed + i), bw = 1 + (n % 3) * .7;
    if (x + bw > w) break;
    bars.push([x, bw]); x += bw + 1 + ((n >> 4) % 3) * .6;
  }
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="currentColor" aria-hidden="true">
      {bars.map(([x, bw], i) => <rect key={i} x={x} y="0" width={bw} height={h} />)}
    </svg>
  );
}

function ChipMark({ metal, w = 46 }: { metal: string; w?: number }) {
  const m = METALS[metal] || METALS.silver;
  const id = "ch" + React.useId().replace(/[^a-zA-Z0-9]/g, "");
  return (
    <svg width={w} height={w * 36 / 46} viewBox="0 0 46 36" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor={m[0]} /><stop offset=".5" stopColor={m[1]} /><stop offset="1" stopColor={m[2]} />
        </linearGradient>
      </defs>
      <rect x=".5" y=".5" width="45" height="35" rx="7" fill={`url(#${id})`} stroke={m[3]} strokeOpacity=".7" />
      <path d="M0 12h14M0 24h14M32 12h14M32 24h14M14 0v10M14 26v10M32 0v10M32 26v10" stroke={m[3]} strokeOpacity=".55" fill="none" />
      <rect x="14" y="10" width="18" height="16" rx="3.5" fill="none" stroke={m[3]} strokeOpacity=".6" />
      <path d="M5 5c4-2.6 10-3 15-2" stroke="#fff" strokeOpacity=".7" strokeWidth="1.4" strokeLinecap="round" fill="none" />
    </svg>
  );
}

function Contactless() {

// Embossed in the chip's metal when the card is issued; lands on the photo's lower corner.

          <span className="bk-rules"><b>Limits</b>{restrictionsOf(d)}</span>
          {nGuideOf(d) && <span className="bk-rules"><b>Guide</b>{nGuideOf(d)}</span>}
          <span className="mrz" aria-label="Machine-readable zone">{mrzOf(d).map((l, i) => <span key={i}>{l}</span>)}</span>
        </div>
      </div>
    </div>
  );
}

// The product's lanyard drag physics, plus a tap (press without moving) that flips the card.
function Lanyard({ onTap, children }: { onTap: () => void; children: React.ReactNode }) {
  const [drag, setDrag] = useState<{ x: number; y: number } | null>(null);
  const origin = useRef<{ x: number; y: number } | null>(null);
  const moved = useRef(0);
  const rest = useRef({ len: 60, r: 200 });
  const strapRef = useRef<HTMLSpanElement>(null);
  const end = () => { origin.current = null; setDrag(null); };
  let swing: any, stretch: any;
  if (drag) {
    const { len, r } = rest.current;
    const dy = drag.y > 0 ? 220 * Math.tanh(drag.y / 280) : -len * .25 * Math.tanh(-drag.y / 90);
    const dx = 260 * Math.tanh(drag.x / 320);
    const reach = Math.hypot(dx, r + dy);
    const h = Math.max(len * .75, len + reach - r);
    swing = { transform: `rotate(${-Math.atan2(dx, r + dy) * 180 / Math.PI}deg)` };
    stretch = { height: h, width: clamp(24 * Math.sqrt(len / h), 16, 24) };
  }
  return (
    <div className="lanyard-anchor">
      <div className={"lanyard" + (drag ? " is-drag" : "")} style={swing} aria-hidden="true"
        onPointerDown={e => {
          const el = e.currentTarget;
          el.setPointerCapture(e.pointerId);
          rest.current = { len: strapRef.current?.offsetHeight || 60, r: Math.max(40, e.clientY - el.getBoundingClientRect().top) };
          origin.current = { x: e.clientX, y: e.clientY }; moved.current = 0; setDrag({ x: 0, y: 0 });
        }}
        onPointerMove={e => {
          const o = origin.current; if (!o) return;
          const x = e.clientX - o.x, y = e.clientY - o.y;
          moved.current = Math.max(moved.current, Math.hypot(x, y)); setDrag({ x, y });
        }}
        onPointerUp={() => { const tap = !!origin.current && moved.current < 5; end(); if (tap) onTap(); }}
        onPointerCancel={end}>
        <div className="lanyard-sway">
          <span ref={strapRef} className="strap" style={stretch as any} />
          <Clip />
          {children}
        </div>
      </div>
    </div>
  );
}

// Draw on the strip with a pointer; "Sign for me" covers keyboard users. Paths are kept in a 240x60 box.
function SignPad({ value, onChange, onStart }: { value: string; onChange: (sig: string) => void; onStart: () => void }) {
  const [live, setLive] = useState("");
  const path = useRef(""), down = useRef(false);
  const at = (e: React.PointerEvent<SVGSVGElement>) => {
    const r = e.currentTarget.getBoundingClientRect();
    return `${((e.clientX - r.left) / r.width * 240).toFixed(1)} ${((e.clientY - r.top) / r.height * 60).toFixed(1)}`;
  };
  const end = () => { if (!down.current) return; down.current = false; onChange(path.current); setLive(""); };
  return (
    <div className="sign">
      <svg className="sign-pad" viewBox="0 0 240 60" role="img" aria-label={value ? "Signature drawn" : "Signature pad, empty"}
        onPointerDown={e => { e.currentTarget.setPointerCapture(e.pointerId); down.current = true; onStart(); path.current = (value ? value + " " : "") + "M" + at(e); setLive(path.current); }}
        onPointerMove={e => { if (!down.current) return; path.current += " L" + at(e); setLive(path.current); }}
        onPointerUp={end} onPointerCancel={end}>
        <line x1="12" y1="48" x2="228" y2="48" className="sign-line" />
        <text x="12" y="44" className="sign-x">×</text>
        <path d={live || value} />
      </svg>
      <div className="sign-ctl">
        <button type="button" className="tx-btn tx-sm" onClick={() => { onStart(); onChange(AUTO_SIG); }}>Sign for me</button>
        <button type="button" className="tx-btn tx-sm" disabled={!value} onClick={() => onChange("")}>Clear</button>
      </div>
    </div>
  );
}

// Rules and behaviour share one editor: a bullet list (Enter adds a line, Backspace on an empty
// line removes it) or free text. Both write the same newline-separated string.
function GuideEditor({ id, label, noun, value, as, onChange, onAs, placeholder, ideas }: {
  id: string; label: string; noun: string; value: string; as: GuideAs; onChange: (v: string) => void; onAs: (a: GuideAs) => void; placeholder: string; ideas: string[];
}) {
  // Rows live here so an empty row can exist while it's being typed; the draft gets the joined string.
  // A change from outside (a suggestion, a format switch, a new draft) resets the rows.
  const split = (v: string) => v === "" ? [] : v.split("\n");
  const [items, setItems] = useState<string[]>(() => split(value));
  useEffect(() => { if (items.join("\n") !== value) setItems(split(value)); }, [value]);
  const refs = useRef<(HTMLInputElement | null)[]>([]);
  const [focusAt, setFocusAt] = useState<number | null>(null);
  useEffect(() => { if (focusAt !== null) { refs.current[focusAt]?.focus(); setFocusAt(null); } }, [focusAt]);
  const write = (next: string[]) => { setItems(next); onChange(next.join("\n")); };
  const count = linesOf(value).length;
  const full = items.length >= GUIDE_ITEMS;
  const add = (text = "", at = items.length) => { if (full) return; const next = [...items]; next.splice(at, 0, text); write(next); if (!text) setFocusAt(at); };
  const unused = ideas.filter(i => !linesOf(value).some(l => l.toLowerCase() === i.toLowerCase()));
  const switchTo = (a: GuideAs) => { if (a === as) return; const clean = linesOf(value); setItems(clean); onChange(clean.join("\n")); onAs(a); };
  return (
    <section className="cap-sec guide" aria-labelledby={id}>
      <span className="field-label">
        <span id={id}>{label}<span className="field-hint after">{count ? (as === "text" ? `${value.trim().length}/${GUIDE_TEXT_MAX}` : plural(count, noun)) : "none yet"}</span></span>
        <Seg label={`${label} format`} value={as} options={[["list", "Bullets"], ["text", "Text"]]} onChange={switchTo} />
      </span>
      {as === "text" ? (
        <textarea className="tx-input" rows={4} value={value} maxLength={GUIDE_TEXT_MAX} placeholder={placeholder} aria-labelledby={id}
          onChange={e => onChange(e.target.value)} />
      ) : (
        <ul className="gl" aria-labelledby={id}>
          {items.map((t, i) => (
            <li key={i} className="gl-row">
              <span className="gl-dot" aria-hidden="true" />
              <input ref={el => { refs.current[i] = el; }} className="tx-input" value={t} maxLength={GUIDE_ITEM_MAX} placeholder={placeholder}
                aria-label={`${label} ${i + 1}`}
                onChange={e => { const next = [...items]; next[i] = e.target.value; write(next); }}
                onKeyDown={e => {
                  // Enter must not submit the form: it starts the next line instead.
                  if (e.key === "Enter") { e.preventDefault(); if (t.trim()) add("", i + 1); }
                  else if (e.key === "Backspace" && !t) { e.preventDefault(); write(items.filter((_, j) => j !== i)); setFocusAt(Math.max(0, i - 1)); }
                }} />
              <button type="button" className="tx-btn tx-ghost tx-icon tx-sm gl-x" aria-label={`Remove ${noun} ${i + 1}`}
                onClick={() => { write(items.filter((_, j) => j !== i)); setFocusAt(Math.min(i, items.length - 2)); }}><Icon name="x" size={13} /></button>
            </li>
          ))}
          <li className="gl-add">
            <button type="button" className="tx-btn tx-ghost tx-sm" disabled={full} onClick={() => add()}>
              <Icon name="plus" size={13} />{full ? `${GUIDE_ITEMS} is the most` : `Add ${noun}`}
            </button>
          </li>
        </ul>
      )}
      {unused.length > 0 && !full && (
        <div className="gl-ideas" role="group" aria-label={`Suggested ${noun}s`}>
          {unused.map(i => (
            <button key={i} type="button" className="tx-chip gl-idea" title={i} onClick={() => {
              if (as === "text") onChange(value.trim() ? value.trim().replace(/[.!]?$/, ". ") + i + "." : i + ".");
              else add(i);
            }}><Icon name="plus" size={12} /><span className="gl-idea-t">{i}</span></button>
          ))}
        </div>
      )}
    </section>
  );
}

// Front is who it is, back is what it can open, then who carries it and the signature.
type Step = "identity" | "access" | "rules" | "sign";
const STEPS: [Step, string][] = [["identity", "Identity"], ["access", "Access"], ["rules", "Rules"], ["sign", "Sign & issue"]];
const stepAt = (s: Step, k: number) => STEPS[Math.max(0, Math.min(STEPS.length - 1, STEPS.findIndex(x => x[0] === s) + k))][0];
const STEP_COPY: Record<Step, string> = {
  identity: "Who it is and what it's for. This prints on the front of its ID.",
  access: "What it can open and what it's good at. This prints on the back.",
  rules: "What it answers, the rules it follows, and how it comes across.",
  sign: "Who can use it, and your signature.",
};

function IssueDesk({ d, set, startStep, onClose, onCreate }: {
  d: Draft; set: (p: Partial<Draft>) => void; startStep: Step; onClose: () => void; onCreate: () => void;
}) {
  const [step, setStep] = useState(startStep);
  const [face, setFace] = useState<"front" | "back">(startStep === "identity" ? "front" : "back");
  const [q, setQ] = useState("");
  // Long catalogues: a featured set plus anything added; "All" opens the rest. Whatever was added stays
  // pinned while collapsed, so peeling one off doesn't make it jump out of view.
  const [allServers, setAllServers] = useState(false);
  const [allSkills, setAllSkills] = useState(false);
  const [sq, setSq] = useState("");
  const [pinSrv, setPinSrv] = useState<string[]>(() => Object.keys(d.servers));
  const [pinSk, setPinSk] = useState<string[]>(() => d.skills);
  const [issued, setIssued] = useState(false);
  const [issuing, setIssuing] = useState(false);
  const modelRef = useRef<HTMLDivElement>(null);
  const formRef = useRef<HTMLFormElement>(null);
  const nameRef = useRef<HTMLInputElement>(null);
  const cardRef = useRef<HTMLDivElement>(null);
  const wrapRef = useRef<HTMLDivElement>(null);
  const tiltRef = useRef<HTMLDivElement>(null);
  // A new photo fades in on the front.
  const [snap, setSnap] = useState(0);
  const photo = (p: Partial<Draft>) => { set(p); setFace("front"); setSnap(n => n + 1); };
  const shuffle = () => {
    let look = d.look; while (look === d.look) look = Math.floor(Math.random() * LOOKS.length);
    photo({ look, tint: TINTS[Math.floor(Math.random() * TINTS.length)].id });
  };
  useEffect(() => { if (step === "identity") setTimeout(() => nameRef.current?.focus(), 30); }, []);
  // Featured models are always shown, plus the choice made in the full list (pinned), so it never
  // hides behind "Fewer" and doesn't vanish while you arrow past it.
  const [allModels, setAllModels] = useState(false);
  const [pinned, setPinned] = useState(d.model);
  const [mq, setMq] = useState("");
  const moreModels = MODELS.length - MODELS.filter(m => m.featured).length;
  const shownModels = allModels ? MODELS.filter(m => matches(mq, m.displayName, m.note, m.badge || ""))
    : MODELS.filter(m => m.featured || m.id === pinned || m.id === d.model);
  const tabStop = shownModels.some(m => m.id === d.model) ? d.model : shownModels[0]?.id;
  // Model cards behave as one radio group: arrows move the choice and the focus together.
  const modelKey = (e: React.KeyboardEvent) => {
    const k = ["ArrowRight", "ArrowDown"].includes(e.key) ? 1 : ["ArrowLeft", "ArrowUp"].includes(e.key) ? -1 : 0;
    if (!k || !shownModels.length || (e.target as HTMLElement).tagName === "INPUT") return;
    e.preventDefault();
    const ids = shownModels.map(m => m.id), i = ids.indexOf(d.model);
    const next = ids[i < 0 ? 0 : (i + k + ids.length) % ids.length];
    set({ model: next });
    setTimeout(() => modelRef.current?.querySelector<HTMLButtonElement>(`[data-id="${next}"]`)?.focus());
  };

  // The card settles slightly when something is added. Restarting a CSS animation needs a reflow between.
  const thud = (delay = 160) => setTimeout(() => {
    const el = wrapRef.current; if (!el) return;
    el.classList.remove("is-thud"); void el.offsetWidth; el.classList.add("is-thud");
  }, delay);
  // The card leans toward the pointer across the stage.
  const track = (e: React.PointerEvent<HTMLDivElement>) => {
    const r = e.currentTarget.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    tiltRef.current?.style.setProperty("--tx", ((.5 - y) * 10).toFixed(2) + "deg");
    tiltRef.current?.style.setProperty("--ty", ((x - .5) * 14).toFixed(2) + "deg");
  };
  const untrack = () => { tiltRef.current?.style.setProperty("--tx", "0deg"); tiltRef.current?.style.setProperty("--ty", "0deg"); };

  const go = (s: Step) => { setStep(s); setFace(s === "identity" ? "front" : "back"); formRef.current?.scrollTo({ top: 0 }); };
  const problem = problemOf(d);
  const nServers = Object.keys(d.servers).length;
  const nGuide = linesOf(d.rules).length + linesOf(d.behaviour).length;
  const toggleServer = (id: string) => {
    const next = { ...d.servers }, adding = !next[id];
    if (adding) next[id] = "read"; else delete next[id]; // least privilege until someone asks for more
    set({ servers: next }); setFace("back"); if (adding) thud();
  };
  const toggleSkill = (id: string) => {
    const adding = !d.skills.includes(id);
    set({ skills: adding ? [...d.skills, id] : d.skills.filter(x => x !== id) }); setFace("back"); if (adding) thud();
  };
  const issue = () => {
    if (problem || issuing) return;
    setIssuing(true);
    const flip = face === "back" ? 700 : 0;
    setFace("front");
    setTimeout(() => { setIssued(true); thud(240); }, flip);
    setTimeout(onCreate, flip + 1900);
  };
  const submit = () => { if (step === "sign") issue(); else go(stepAt(step, 1)); };
  // A search always looks through the whole catalogue.
  const serverWide = allServers || !!q.trim();
  const srvShort = SERVERS.filter((s, i) => i < SERVER_FEATURED || d.servers[s.id] || pinSrv.includes(s.id));
  const skShort = SKILLS.filter((s, i) => i < SKILL_FEATURED || d.skills.includes(s.id) || pinSk.includes(s.id));
  const servers = (serverWide ? SERVERS : srvShort).filter(s => matches(q, s.name, s.blurb));
  const skills = allSkills ? SKILLS.filter(s => matches(sq, s.name, s.blurb)) : skShort;
  // "All" only appears when the short list is hiding something.
  const srvHidden = SERVERS.length - srvShort.length, skHidden = SKILLS.length - skShort.length;

  return (
    <div className="scrim center" onMouseDown={onClose} onKeyDown={e => { if (e.key === "Escape") onClose(); }}>
      <div className="agent-dialog idd" role="dialog" aria-modal="true" aria-labelledby="idd-title" onMouseDown={e => e.stopPropagation()}>
        <button type="button" className="tx-btn tx-ghost tx-icon tx-sm dialog-x" onClick={onClose} aria-label="Close"><Icon name="x" size={15} /></button>
        <form ref={formRef} className="nad-form" onSubmit={e => { e.preventDefault(); submit(); }}>
          <div className="nad-head">
            <h2 id="idd-title">New agent</h2>
            <p>{STEP_COPY[step]}</p>
          </div>
          <div className="steps" role="tablist" aria-label="Steps">
            {STEPS.map(([id, label], i) => { const done = i < STEPS.findIndex(s => s[0] === step) && (id !== "identity" || !problem); return (
              <button key={id} type="button" role="tab" id={"idd-tab-" + id} aria-controls="idd-panel" aria-selected={step === id} className="step" onClick={() => go(id)}>
                <span className={"step-n" + (done ? " is-done" : "")}>{done ? <Icon name="check" size={11} stroke={2.5} /> : i + 1}</span><span className="step-l">{label}</span>
                {id === "access" && nServers + d.skills.length > 0 && <span className="step-count">{nServers + d.skills.length}</span>}
                {id === "rules" && nGuide > 0 && <span className="step-count">{nGuide}</span>}
              </button>
            ); })}
          </div>

          <div id="idd-panel" role="tabpanel" aria-labelledby={"idd-tab-" + step} style={{ display: "contents" }}>
            {step === "identity" && (
              <>
                <label className="field">
                  <span className="field-label">Name<span className="field-hint">@{handleOf(d.name) || "handle"}</span></span>
                  <input ref={nameRef} className="tx-input" value={d.name} maxLength={NAME_MAX} placeholder="Research Scout" onChange={e => set({ name: e.target.value })} />
                </label>
                <label className="field">
                  <span className="field-label">Purpose<span className="field-hint">{d.purpose.trim().length}/{PURPOSE_MAX}</span></span>
                  <textarea className="tx-input" rows={2} value={d.purpose} maxLength={PURPOSE_MAX} placeholder="What this specialist owns" onChange={e => set({ purpose: e.target.value })} />
                </label>
                <LookPicker d={d} set={photo} onShuffle={shuffle} />
                <div className="field" onKeyDown={modelKey}>
                  <span className="field-label model-label">
                    <span id="idd-model">Model{allModels && <span className="field-hint after">{plural(MODELS.length, "model")}</span>}</span>
                    {moreModels > 0 && (
                      <span className="model-tools">
                        {allModels && MODELS.length >= MODEL_SEARCH_AT && (
                          <span className="cap-search inline">
                            <Icon name="search" size={13} />
                            <input className="tx-input" placeholder="Search models" value={mq} onChange={e => setMq(e.target.value)} aria-label="Search models" />
                          </span>
                        )}
                        <button type="button" className="field-hint linkish" aria-expanded={allModels} aria-controls="idd-models"
                          onClick={() => { if (allModels) setPinned(d.model); setAllModels(o => !o); setMq(""); }}>{allModels ? "Fewer" : `All models (${MODELS.length})`}</button>
                      </span>
                    )}
                  </span>
                  <div id="idd-models" className={"model-grid" + (allModels ? " is-all" : "")} role="radiogroup" aria-labelledby="idd-model" ref={modelRef}>
                    {shownModels.map(m => { const on = d.model === m.id; return (
                      <button key={m.id} type="button" role="radio" data-id={m.id} aria-checked={on} tabIndex={m.id === tabStop ? 0 : -1}
                        className="mc" title={m.displayName} onClick={() => set({ model: m.id })}>
                        <span className="mc-top">
                          <span className="mc-name">{m.displayName.replace("Claude ", "")}</span>
                          <span className="mc-dot" aria-hidden="true">{on && <Icon name="check" size={10} stroke={3} />}</span>
                        </span>
                        <span className="mc-sub">{m.badge && <span className="mc-badge">{m.badge}</span>}<span className="mc-note">{m.note}</span></span>
                      </button>
                    ); })}
                    {!shownModels.length && <div className="mc-none">No model matches "{mq}".</div>}
                  </div>
                </div>
              </>
            )}

            {step === "access" && (
              <>
                <section className="cap-sec" aria-labelledby="idd-mcp">
                  <span className="field-label">
                    <span id="idd-mcp">MCP servers<span className="field-hint after">{nServers ? `${nServers} added · ${plural(toolsOf(d), "tool")}` : "none yet"}</span></span>
                    <span className="model-tools">
                      <span className="cap-search inline">
                        <Icon name="search" size={13} />
                        <input className="tx-input" placeholder="Search servers" value={q} onChange={e => setQ(e.target.value)} aria-label="Search MCP servers" />
                      </span>
                      {(allServers || srvHidden > 0) && (
                        <button type="button" className="field-hint linkish" aria-expanded={allServers} aria-controls="idd-sheet"
                          onClick={() => { if (allServers) setPinSrv(Object.keys(d.servers)); setAllServers(o => !o); }}>{allServers ? "Fewer" : `All (${SERVERS.length})`}</button>
                      )}
                    </span>
                  </span>
                  <div id="idd-sheet" className={"sheet" + (serverWide ? " is-all" : "")} role="group" aria-label="MCP server stickers">
                    {servers.map(s => { const on = d.servers[s.id]; return (
                      <div key={s.id} className={"peel" + (on ? " is-on" : "")}>
                        <button type="button" className="peel-b" aria-pressed={!!on} title={on ? `Peel ${s.name} off` : `${s.blurb} · ${s.tools} tools`} onClick={() => toggleServer(s.id)}>

                          <span className="peel-n">{s.name}</span>
                          {!on && <span className="peel-t">{s.tools} tools</span>}
                        </button>
                        {on && <Seg className="on-sheet" label={`${s.name} access`} value={on} options={[["read", "READ"], ["write", "R/W"]]}
                          onChange={v => set({ servers: { ...d.servers, [s.id]: v } })} />}
                      </div>
                    ); })}
                    {!servers.length && <div className="cap-none">No server matches "{q}".</div>}
                  </div>
                  <span className="cap-note">New stickers start on READ. R/W lets it create and change things.</span>
                </section>

                <section className="cap-sec" aria-labelledby="idd-skills">
                  <span className="field-label">

                          <span className="cap-search inline">

                            <input className="tx-input" placeholder="Search skills" value={sq} onChange={e => setSq(e.target.value)} aria-label="Search skills" />

                          onClick={() => { if (allSkills) setPinSk(d.skills); setAllSkills(o => !o); setSq(""); }}>{allSkills ? "Fewer" : `All (${SKILLS.length})`}</button>
                      </span>
                    )}
                  </span>
                  <div id="idd-chips" className={"chips" + (allSkills ? " is-all" : "")}>
                    {skills.map(s => { const on = d.skills.includes(s.id); return (
                      <button key={s.id} type="button" className={"tx-chip" + (on ? " is-on" : "")} aria-pressed={on} title={s.blurb} onClick={() => toggleSkill(s.id)}>
                        <Icon name={on ? "check" : s.glyph} size={13} stroke={on ? 2.4 : 1.75} />{s.name}
                      </button>
                    ); })}
                    {!skills.length && <div className="cap-none">No skill matches "{sq}".</div>}
                  </div>
                </section>

                <div className="soon slim">
                  <span className="cap-glyph"><Icon name="book" size={14} /></span>
                  <span className="cap-note"><span className="strong">Knowledge</span> <span className="tx-pill tx-pill-sm">Soon</span> Docs and folders it reads from.</span>
                </div>
              </>
            )}

            {step === "rules" && (
              <>
                <fieldset className="field tad-scope">
                  <legend className="field-label">What it answers</legend>
                  <div className="scope-row">
                    {TOPIC_OPTIONS.map(o => (
                      <label key={o.id} className={"tad-scope-option" + (d.topics === o.id ? " is-active" : "")}>
                        <input type="radio" name="idd-topics" checked={d.topics === o.id} onChange={() => { set({ topics: o.id }); setFace("back"); }} />
                        <span><span className="strong block">{o.label}</span><span className="muted sm">{o.hint(d.purpose.trim())}</span></span>
                      </label>
                    ))}
                  </div>
                </fieldset>
                <GuideEditor id="idd-rules" label="Rules" noun="rule" value={d.rules} as={d.rulesAs}
                  onChange={v => { set({ rules: v }); setFace("back"); }} onAs={a => set({ rulesAs: a })}
                  placeholder="Never share customer data outside the workspace" ideas={RULE_IDEAS} />
                <GuideEditor id="idd-behaviour" label="Behaviour" noun="behaviour" value={d.behaviour} as={d.behaviourAs}
                  onChange={v => { set({ behaviour: v }); setFace("back"); }} onAs={a => set({ behaviourAs: a })}
                  placeholder="Lead with the answer, then the detail" ideas={BEHAVIOUR_IDEAS} />
              </>
            )}

            {step === "sign" && (
              <>
                <fieldset className="field tad-scope">
                  <legend className="field-label">Who can use it</legend>
                  <div className="scope-row">
                    {SCOPES.map(s => (
                      <label key={s.id} className={"tad-scope-option" + (d.scope === s.id ? " is-active" : "")}>
                        <input type="radio" name="idd-scope" checked={d.scope === s.id} onChange={() => { set({ scope: s.id }); setFace("front"); }} />
                        <span><span className="strong block">{s.label}</span><span className="muted sm">{s.hint}</span></span>
                      </label>
                    ))}
                  </div>
                </fieldset>


                <section className="cap-sec" aria-labelledby="idd-sign">
                  <span className="field-label" id="idd-sign">Signature<span className="field-hint">optional</span></span>
                  <SignPad value={d.sig} onChange={sig => { set({ sig }); setFace("back"); }} onStart={() => setFace("back")} />
                </section>
              </>
            )}
          </div>

          <div className="nad-actions">
            {step !== "identity" && problem && <span className="hint">{problem} on the Identity step first</span>}
            <span className="grow" />
            {step === "identity"
              ? <button type="button" className="tx-btn tx-lg" onClick={onClose}>Cancel</button>
              : <button type="button" className="tx-btn tx-lg" onClick={() => go(stepAt(step, -1))}>Back</button>}
            <button type="submit" className="tx-btn tx-primary tx-lg" disabled={step === "sign" && (!!problem || issuing)}>
              {step !== "sign" ? <>Continue <Icon name="chevronR" size={14} /></> : issuing ? "Issuing…" : "Issue ID"}
            </button>
          </div>
        </form>

        <div className="nad-stage studio" onPointerMove={track} onPointerLeave={untrack}>
          <Lanyard onTap={() => setFace(f => f === "front" ? "back" : "front")}>
            <div ref={wrapRef} className="idc-wrap"><div ref={tiltRef} className="idc-tilt"><IdCard d={d} face={face} issued={issued} snap={snap} cardRef={cardRef} /></div></div>
          </Lanyard>
          <span className="studio-note" aria-hidden="true">Drag to swing · tap to flip</span>
          <div className="stage-ctl">
            <Seg label="Card side" value={face} options={[["front", "Front"], ["back", "Back"]]} onChange={setFace} />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================ harness (this page only) */
// ?step=access|rules|sign opens on that step, ?blank=1 starts from an empty draft, ?model=opus|haiku picks the model.
const SAMPLE: Draft = { ...SAMPLE_DRAFT, servers: { sentry: "read", slack: "write", github: "read", linear: "read" }, skills: ["triage", "postmortem", "summarize"], sig: AUTO_SIG };

// Worst case for the card: everything attached and a name that wraps.
const FULL: Draft = { ...SAMPLE, name: "Platform Reliability Lead", purpose: "Own deploy health end to end: watch errors, open and close tickets, and post the weekly reliability digest",
  servers: Object.fromEntries(SERVERS.map((s, i) => [s.id, i % 3 === 1 ? "write" : "read"])) as Record<string, Access>, skills: SKILLS.map(s => s.id),
  rules: ["Never share customer data outside the workspace", "Cite the source for every claim", "Escalate to a human when unsure", "Stay out of production on Fridays",
    "Never close a ticket it didn't open", "Tag the owning team on every incident", "Keep a running timeline during an outage", "Ask before paging more than one person"].join("\n"),
  behaviour: ["Be concise", "Lead with the answer", "Ask before assuming", "Friendly, not chatty", "Use plain words over jargon"].join("\n"), behaviourAs: "list" };
type Fill = "sample" | "blank" | "full";
const DRAFTS: Record<Fill, Draft> = { sample: SAMPLE, blank: BLANK_DRAFT, full: FULL };

function Harness() {
  const q = new URLSearchParams(location.search);
  const start: Fill = q.get("blank") ? "blank" : q.get("fill") === "full" ? "full" : "sample";
  const [fill, setFill] = useState<Fill>(start);
  const [d, setD] = useState<Draft>(() => ({ ...DRAFTS[start], ...(MODELS.some(m => m.id === q.get("model")) ? { model: q.get("model")! } : {}) }));
  const [open, setOpen] = useState(true);
  const [run, setRun] = useState(0);
  const [toast, setToast] = useState("");
  const [theme, setTheme] = useState(document.documentElement.dataset.effTheme || "light");
  useEffect(() => { const r = document.documentElement; r.dataset.theme = theme; r.dataset.effTheme = theme; try { localStorage.setItem("tx-sys-theme", theme); } catch (e) {} }, [theme]);
  const set = React.useCallback((p: Partial<Draft>) => setD(x => ({ ...x, ...p })), []);
  const reopen = () => { setToast(""); setOpen(true); setRun(r => r + 1); };
  return (
    <>
      <div className="hx-bar" role="toolbar" aria-label="Preview">
        <span className="hx-title">Agent ID</span>
        <Seg label="Draft" value={fill} options={[["sample", "Sample"], ["blank", "Blank"], ["full", "Full"]]}
          onChange={v => { setFill(v); setD(DRAFTS[v]); reopen(); }} />
        <Seg label="Catalogue" value={LARGE_CATALOG ? "large" : "small"} options={[["small", "Small catalogue"], ["large", "Large catalogue"]]}
          onChange={v => { const u = new URLSearchParams(location.search); u.delete("models"); if (v === "large") u.set("catalog", "large"); else u.delete("catalog"); location.search = u.toString(); }} />
        {toast && <span className="hx-toast" role="status">{toast}</span>}
        <button type="button" className="tx-btn tx-sm" onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}>
          <Icon name={theme === "dark" ? "sun" : "moon"} size={14} />{theme === "dark" ? "Light" : "Dark"}
        </button>
        {!open && <button type="button" className="tx-btn tx-primary" onClick={reopen}>Reopen</button>}
      </div>
      {open && <IssueDesk key={run} d={d} set={set} startStep={(["access", "rules", "sign"] as Step[]).find(x => x === q.get("step")) || "identity"}
        onClose={() => setOpen(false)} onCreate={() => { setToast("Issued " + d.name.trim()); setOpen(false); }} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")!).render(<Harness />);
