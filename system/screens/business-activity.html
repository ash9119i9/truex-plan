<script>
/* Foundation theme bootstrap — identical to the other screens, so this page
   honours the four contexts (light/dark × normal/more) and remembers choice. */
(function () {
  var r = document.documentElement, pref = "auto", size = "100", contrast = "system";
  try {
    pref = localStorage.getItem("tx-sys-theme") || "auto";
    size = localStorage.getItem("tx-sys-size") || "100";
    contrast = localStorage.getItem("tx-sys-contrast") || "system";
  } catch (e) {}
  var q = new URLSearchParams(location.search);
  if (["auto", "light", "dark"].indexOf(q.get("theme")) > -1) pref = q.get("theme");
  if (["100", "150", "200"].indexOf(q.get("textsize")) > -1) size = q.get("textsize");
  if (["system", "normal", "more"].indexOf(q.get("contrast")) > -1) contrast = q.get("contrast");
  r.dataset.theme = pref;
  r.dataset.contrast = contrast;
  if (size !== "100") r.dataset.textsize = size;
  var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  var more = contrast === "more" || (contrast === "system" && matchMedia("(prefers-contrast: more)").matches);
  r.dataset.effTheme = dark ? "dark" : "light";
  r.dataset.effContrast = more ? "more" : "normal";
  r.dataset.effMotion = matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduce" : "full";
})();
</script>

<main class="stage">
  <header class="bar">
    <div class="bar-id">
      <span class="t-micro bar-crumb">truex / activity panel</span>
      <h1 class="bar-title" id="bar-title">Business activity &amp; traces <span>· one turn</span></h1>
    </div>
    <div class="bar-ctl">
      <span class="t-micro bar-lbl" id="state-lbl">State</span>
      <div class="tx-seg tx-seg-sm" role="group" aria-labelledby="state-lbl" id="state">
        <button type="button" data-s="live">Working</button>
        <button type="button" data-s="needs">Needs you</button>
        <button type="button" data-s="done">Done</button>
        <button type="button" data-s="declined">Declined</button>
        <button type="button" data-s="issue">Step failed</button>
        <button type="button" data-s="stopped">Stopped</button>
      </div>
      <span class="t-micro bar-lbl" id="steer-lbl">Note</span>
      <div class="tx-seg tx-seg-sm" role="group" aria-labelledby="steer-lbl" id="steer">
        <button type="button" data-n="0">None</button>
        <button type="button" data-n="1">Steered</button>
      </div>
      <span class="t-micro bar-lbl" id="crew-lbl">Crew</span>
      <div class="tx-seg tx-seg-sm" role="group" aria-labelledby="crew-lbl" id="crew">
        <button type="button" data-c="solo">One agent</button>
        <button type="button" data-c="team">With helpers</button>
      </div>
      <button class="tx-btn tx-ghost tx-icon tx-sm" id="theme" type="button" aria-label="Toggle theme">
        <svg class="tx-ic" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- what each block of the tab answers; reads as the design rationale -->
    <section class="notes" aria-label="What this tab answers">
      <p class="t-micro notes-h">What this tab answers</p>
      <ol class="notes-list" id="notes"></ol>
    </section>

    <aside class="ap" aria-label="Activity panel">
      <header class="ap-head">
        <nav class="ap-crumb" aria-label="Scope">
          <button type="button" class="ap-crumb-home" id="home">Session</button>
          <svg class="tx-ic tx-ic-sm" aria-hidden="true"><use href="#i-chev"/></svg>
          <span class="ap-crumb-here" aria-current="page">Turn <span class="num">4</span><span class="ap-crumb-of"> of <span class="num">4</span></span></span>
        </nav>
        <div class="ap-head-act">
          <button class="tx-btn tx-ghost tx-icon tx-xs" type="button" id="prev" aria-label="Previous turn"><svg class="tx-ic tx-ic-sm" aria-hidden="true"><use href="#i-chev-l"/></svg></button>
          <button class="tx-btn tx-ghost tx-icon tx-xs" type="button" aria-label="Next turn" disabled><svg class="tx-ic tx-ic-sm" aria-hidden="true"><use href="#i-chev"/></svg></button>
          <button class="tx-btn tx-ghost tx-icon tx-xs" type="button" id="close" aria-label="Close panel"><svg class="tx-ic tx-ic-sm" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
      </header>

      <div class="tx-tabs ap-tabs" role="tablist" aria-label="Activity panel sections">
        <button type="button" role="tab" id="tab-activity" aria-selected="true" aria-controls="body">Activity</button>
        <button type="button" role="tab" id="tab-agent" aria-selected="false" aria-controls="body">Agent</button>
        <button type="button" role="tab" id="tab-files" aria-selected="false" aria-controls="body">Files</button>
        <button type="button" role="tab" id="tab-insights" aria-selected="false" aria-controls="body">Insights</button>
      </div>

      <div class="ap-body" id="body" role="tabpanel" aria-labelledby="tab-activity" tabindex="0"></div>

      <footer class="ap-foot" id="foot">
        <span class="ap-foot-l">
          <span class="t-micro">Trace</span>
          <button type="button" class="tx-chip tx-chip-ref" id="trace-id" aria-label="Copy trace ID">tr_7f3a91c2<svg class="tx-ic tx-ic-sm" aria-hidden="true"><use href="#i-copy"/></svg></button>
        </span>
        <button type="button" class="tx-btn tx-ghost tx-xs" id="export"><svg class="tx-ic tx-ic-sm" aria-hidden="true"><use href="#i-download"/></svg>Export log</button>
      </footer>
    </aside>
  </div>
</main>
<div class="tx-toast-host" id="toasts" aria-live="polite"></div>

</html>
